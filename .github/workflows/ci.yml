name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truflow_booking_ci?schema=public
  RESEND_API_KEY: re_ci_placeholder
  EMAIL_FROM_ADDRESS: bookings@example.test
  NEXTAUTH_SECRET: ci_secret_key
  IDEMPOTENCY_HMAC_SECRET: ci_idempotency_hmac_secret_at_least_32_chars
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:3000

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truflow_booking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d truflow_booking_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: validate
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truflow_booking_ci_test
      INTEGRATION_REDIS_URL: redis://localhost:6379
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truflow_booking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d truflow_booking_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        run: pnpm exec prisma db seed

      - name: Provision isolated integration database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE truflow_booking_ci_test'
          DATABASE_URL="$INTEGRATION_DATABASE_URL" pnpm exec prisma migrate deploy

      - name: Run unit and integration tests
        env:
          NODE_ENV: test
        run: pnpm test

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Snyk scan
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npx snyk test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
