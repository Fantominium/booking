# Production-safe baseline: no database/cache ports are published and every secret is required.
# Local development layers docker-compose.override.yml on top automatically (loopback ports, dev credentials).
# Production: `docker compose -f docker-compose.yml up -d` (the override is NOT loaded when -f is given).
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app-env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?set EMAIL_FROM_ADDRESS}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      IDEMPOTENCY_HMAC_SECRET: ${IDEMPOTENCY_HMAC_SECRET:?set IDEMPOTENCY_HMAC_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      PII_PURGE_LEGAL_HOLD: ${PII_PURGE_LEGAL_HOLD:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    networks: [data, edge]
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env
    networks: [data, edge]

networks:
  # No external connectivity: only containers attached here can reach PostgreSQL and Redis.
  data:
    internal: true
  # Outbound access for the worker (email provider) and inbound for the web app.
  edge: {}

volumes:
  postgres-data:
  redis-data:
